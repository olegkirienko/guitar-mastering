services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guitar_mastering
      POSTGRES_USER: guitar_mastering
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guitar_mastering -d guitar_mastering"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - guitar-mastering-postgres:/var/lib/postgresql/data

volumes:
  guitar-mastering-postgres:
