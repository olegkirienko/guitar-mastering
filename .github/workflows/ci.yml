name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: guitar_mastering
          POSTGRES_USER: guitar_mastering
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guitar_mastering -d guitar_mastering"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint

      - name: Unit and foundation acceptance tests
        run: pnpm test

      - name: Browser regression tests
        run: pnpm test:browser

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://guitar_mastering:integration-test-only@127.0.0.1:5432/guitar_mastering
        run: pnpm test:postgres

      - name: Build GitHub Pages
        run: pnpm build:pages

      - name: Build Railway artifact
        run: pnpm build:railway
