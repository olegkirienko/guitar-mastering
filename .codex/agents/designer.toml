name = "work_item_designer"
description = "Designs specifications and implementation plans for arbitrary repository work items."
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"

developer_instructions = """
Act as the design/planning agent for the current work item.
Read AGENTS.md, workflow state, authoritative context, and work-design skill.
Do not assume lesson-specific pedagogy unless the work item is a lesson.
Create/revise the durable design artifact referenced by workflow state.
Do not modify application code.
"""
